<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Journal du scraper · LRDL</title>
<style>
  :root { --gold:#C9A961; --ink:#1a1a1a; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f6f7f9; color:var(--ink); }
  header { background:#fff; border-bottom:1px solid #e5e7eb; padding:12px 20px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:10; }
  .logo { width:32px; height:32px; border-radius:8px; background:var(--gold); color:#fff; font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  header h1 { font-size:14px; } header p { font-size:11px; color:#9ca3af; }
  header nav { margin-left:auto; display:flex; gap:8px; align-items:center; }
  header nav a { font-size:11px; color:#6b7280; text-decoration:none; background:#f3f4f6; padding:6px 10px; border-radius:8px; white-space:nowrap; }
  main { max-width:860px; margin:0 auto; padding:20px 16px 60px; }
  .bar { background:#fff; border:1px solid #f0f0f0; border-radius:12px; padding:12px; margin-bottom:18px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; }
  .grp { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:0; background:#f3f4f6; color:#4b5563; padding:7px 12px; border-radius:8px; font-size:11px; font-weight:600; cursor:pointer; }
  .chip.on { background:var(--gold); color:#fff; }
  .tots { font-size:11px; color:#6b7280; display:flex; gap:12px; }
  .day { margin-bottom:22px; }
  .day h2 { font-size:13px; text-transform:capitalize; position:sticky; top:57px; background:#f6f7f9; padding:4px 0; z-index:5; }
  .day .sub { font-size:11px; color:#9ca3af; margin-bottom:8px; }
  .art { background:#fff; border:1px solid #f0f0f0; border-radius:10px; padding:10px; margin-bottom:7px; display:flex; gap:9px; align-items:flex-start; }
  .st { flex:0 0 auto; font-size:10px; font-weight:700; padding:2px 9px; border-radius:99px; margin-top:1px; }
  .art .ti { font-size:12.5px; font-weight:600; line-height:1.35; }
  .art .meta { font-size:10.5px; color:#9ca3af; margin-top:3px; }
  .art .meta a { color:#b45309; }
  .art .lnk { display:inline-block; font-size:10.5px; color:#b45309; font-weight:600; text-decoration:none; margin-top:5px; }
  .empty { font-size:11px; color:#9ca3af; text-align:center; padding:30px 0; }
  .foot { font-size:11px; color:#9ca3af; text-align:center; margin-top:20px; }
  #gate { position:fixed; inset:0; background:#f6f7f9; display:flex; align-items:center; justify-content:center; z-index:100; }
  #gate .box { background:#fff; border:1px solid #e5e7eb; border-radius:14px; padding:28px; width:100%; max-width:360px; box-shadow:0 10px 30px rgba(0,0,0,.06); }
  #gate .logo { margin:0 auto 12px; }
  #gate h2 { font-size:15px; text-align:center; margin-bottom:4px; }
  #gate p { font-size:11px; color:#9ca3af; text-align:center; margin-bottom:16px; }
  #gate input { width:100%; border:1px solid #e5e7eb; border-radius:8px; padding:10px; font-size:13px; margin-bottom:10px; }
  #gate button { width:100%; border:0; border-radius:8px; padding:10px; font-size:13px; font-weight:600; background:var(--gold); color:#fff; cursor:pointer; }
  #gate .err { color:#dc2626; font-size:11px; text-align:center; min-height:16px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <div class="logo">RL</div>
  <div><h1>Articles La Revue du Luxe · scrappés &amp; publiés</h1><p>Journal quotidien du scraper LRDL · larevueduluxe.com</p></div>
  <nav id="topnav" style="display:none">
    <a href="index.html">← Hub</a>
    <a href="triage.html">✨ Tri du jour</a>
  </nav>
</header>
<div id="gate">
  <div class="box">
    <div class="logo">RL</div>
    <h2>La Revue · Hub</h2>
    <p>Accès réservé · connecte-toi</p>
    <input type="email" id="gmail" placeholder="E-mail" autocomplete="username">
    <input type="password" id="gpass" placeholder="Mot de passe" autocomplete="current-password">
    <button id="gbtn">Se connecter</button>
    <div class="err" id="gerr"></div>
  </div>
</div>
<main id="appmain" style="display:none">
  <div class="bar">
    <div class="grp" id="ranges">
      <button class="chip" data-r="today">Aujourd'hui</button>
      <button class="chip on" data-r="7">7 derniers jours</button>
      <button class="chip" data-r="all">Tout</button>
    </div>
    <div class="tots" id="tots"></div>
  </div>
  <div id="days"></div>
  <p class="foot">Données en direct depuis Firestore (collection <code>news_drafts_auto</code>) · scraper La Revue du Luxe.</p>
</main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, query, orderBy, limit, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

const app = initializeApp({
  apiKey: 'AIzaSyABF1kdT3IKZQfnLwzlCDWiJb5lezZ0_sA',
  authDomain: 'larevue-auto-dashboard.firebaseapp.com',
  projectId: 'larevue-auto-dashboard',
  storageBucket: 'larevue-auto-dashboard.firebasestorage.app',
  messagingSenderId: '1064950692754',
  appId: '1:1064950692754:web:4127b04a4e7162d36d1f4b',
});
const db = getFirestore(app);
const auth = getAuth(app);

const STATUS = {
  published:     { label:'Publié',    color:'#16a34a', bg:'#f0fdf4' },
  ai_draft_auto: { label:'Brouillon', color:'#b45309', bg:'#fffbeb' },
  archived:      { label:'Écarté',    color:'#6b7280', bg:'#f9fafb' },
  rejected:      { label:'Rejeté',    color:'#dc2626', bg:'#fef2f2' },
  rejected_auto: { label:'Rejeté',    color:'#dc2626', bg:'#fef2f2' },
};
const st = s => STATUS[s] || { label: s || '—', color:'#6b7280', bg:'#f9fafb' };

const esc = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toDate = v => { if (!v) return null; if (v.toDate) return v.toDate(); if (v.seconds) return new Date(v.seconds*1000);
  const d = new Date(v); return Number.isNaN(d.getTime()) ? null : d; };
const fmtTime = d => d ? d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : '';
const dayKey = d => d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` : 'sans-date';
const fmtDay = d => { if (!d) return 'Sans date';
  const days = Math.floor((Date.now()-d.getTime())/86400000);
  const rel = days <= 0 ? "Aujourd'hui" : days === 1 ? 'Hier' : `il y a ${days} jours`;
  return `${d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})} · ${rel}`; };
const srcDomain = u => { try { return new URL(u).hostname.replace(/^www\./,''); } catch { return ''; } };

let rows = [], range = '7';

function render() {
  const startToday = new Date(); startToday.setHours(0,0,0,0);
  const start7 = new Date(startToday.getTime() - 6*86400000);
  const inR = d => range === 'all' ? true : range === 'today' ? (d && d >= startToday) : (d && d >= start7);
  const list = rows.filter(a => inR(toDate(a.createdAt)));

  const pub = list.filter(a => a.status === 'published').length;
  const dr = list.filter(a => a.status === 'ai_draft_auto').length;
  document.getElementById('tots').innerHTML =
    `<span><b>${list.length}</b> article${list.length!==1?'s':''}</span>
     <span style="color:#16a34a">✅ ${pub} publié${pub!==1?'s':''}</span>
     <span style="color:#b45309">📝 ${dr} brouillon${dr!==1?'s':''}</span>`;

  const groups = {};
  for (const a of list) {
    const d = toDate(a.createdAt); const k = dayKey(d);
    (groups[k] = groups[k] || { date: d, items: [] }).items.push(a);
  }
  const days = Object.entries(groups).sort((a,b) => (b[1].date?.getTime()||0) - (a[1].date?.getTime()||0));

  document.getElementById('days').innerHTML = !days.length ? '<div class="empty">Aucun article sur cette période.</div>'
    : days.map(([k, g]) => {
      const p = g.items.filter(a => a.status === 'published').length;
      const d2 = g.items.filter(a => a.status === 'ai_draft_auto').length;
      const other = g.items.length - p - d2;
      const items = g.items.sort((a,b) => (toDate(b.createdAt)?.getTime()||0) - (toDate(a.createdAt)?.getTime()||0));
      return `<section class="day">
        <h2>${fmtDay(g.date)}</h2>
        <div class="sub">${g.items.length} article${g.items.length!==1?'s':''} · <span style="color:#16a34a">${p} publié${p!==1?'s':''}</span> · <span style="color:#b45309">${d2} brouillon${d2!==1?'s':''}</span>${other ? ` · ${other} écarté${other!==1?'s':''}` : ''}</div>
        ${items.map(a => {
          const s = st(a.status);
          const title = (a.aiTitle || a.title || a.id || '').trim();
          const headline = title.length > 150 ? title.slice(0,148).trimEnd()+'…' : title;
          const created = toDate(a.createdAt), published = toDate(a.publishedAt || a.publishedToWpAt);
          const cat = a.categoryDisplay || a.category;
          const domain = srcDomain(a.sourceUrl);
          return `<div class="art">
            <span class="st" style="background:${s.bg};color:${s.color}">${s.label}</span>
            <div style="min-width:0;flex:1">
              <div class="ti">${esc(headline)}</div>
              <div class="meta">${cat ? esc(cat)+' · ' : ''}${created ? '🕒 scrappé '+fmtTime(created) : ''}${published ? ' · <span style="color:#16a34a">✅ publié '+fmtTime(published)+'</span>' : ''}${domain ? ` · <a href="${esc(a.sourceUrl)}" target="_blank" rel="noopener">${esc(domain)}</a>` : ''}</div>
              ${a.status === 'published' && (a.wordpressUrl || a.wpUrl) ? `<a class="lnk" href="${esc(a.wordpressUrl || a.wpUrl)}" target="_blank" rel="noopener">Voir l'article publié →</a>` : ''}
            </div></div>`;
        }).join('')}
      </section>`;
    }).join('');
}

document.querySelectorAll('#ranges .chip').forEach(b => b.onclick = () => {
  document.querySelectorAll('#ranges .chip').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); range = b.dataset.r; render();
});

document.getElementById('gbtn').onclick = async () => {
  const err = document.getElementById('gerr'); err.textContent = '';
  try { await signInWithEmailAndPassword(auth, document.getElementById('gmail').value.trim(), document.getElementById('gpass').value); }
  catch { err.textContent = 'Identifiants invalides.'; }
};
document.getElementById('gpass').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('gbtn').click(); });
let started = false;
onAuthStateChanged(auth, user => {
  document.getElementById('gate').style.display = user ? 'none' : 'flex';
  document.getElementById('topnav').style.display = user ? 'flex' : 'none';
  document.getElementById('appmain').style.display = user ? 'block' : 'none';
  if (user && !started) {
    started = true;
    // ⚠️ Chaque attache relit les 250 documents, reconnexion reseau comprise.
    // Sur un portable qui s'endort, un onglet laisse ouvert multiplie donc les
    // lectures : c'est ce qui a fait sauter le quota le 29/08/2026. On coupe
    // l'ecoute tant que la page n'est pas regardee.
    let _stop = null;
    const _demarrer = () => onSnapshot(query(collection(db, 'news_drafts_auto'), orderBy('createdAt','desc'), limit(250)), snap => {
      const r = []; snap.forEach(d => r.push({ id: d.id, ...d.data() }));
      rows = r; render();
    }, e => { document.getElementById('days').innerHTML = '<div class="empty">Erreur de chargement : '+esc(e.message)+'</div>'; });
    const _on  = () => { if (!_stop) _stop = _demarrer(); };
    const _off = () => { if (_stop) { _stop(); _stop = null; } };
    document.addEventListener('visibilitychange', () => (document.hidden ? _off() : _on()));
    window.addEventListener('pagehide', _off);
    if (!document.hidden) _on();
  }
});
</script>
</body>
</html>
